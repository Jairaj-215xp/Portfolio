<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="600" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090E23"/>
      <stop offset="50%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0a0319"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background with ambient glowing orbs -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="200" fill="url(#glow1)"/>
  <circle cx="480" cy="280" r="200" fill="url(#glow2)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 50 H600 M0 100 H600 M0 150 H600 M0 200 H600 M0 250 H600 M0 300 H600 M0 350 H600"/>
    <path d="M50 0 V400 M100 0 V400 M150 0 V400 M200 0 V400 M250 0 V400 M300 0 V400 M350 0 V400 M400 0 V400 M450 0 V400 M500 0 V400 M550 0 V400"/>
  </g>

  <!-- Mockup Browser Window -->
  <rect x="60" y="50" width="480" height="300" rx="16" fill="#0c1126" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- Browser Header Bar -->
  <path d="M 60 66 A 16 16 0 0 1 76 50 L 524 50 A 16 16 0 0 1 540 66 L 540 85 L 60 85 Z" fill="#151b36"/>
  
  <!-- Browser Window Dots -->
  <circle cx="88" cy="67" r="5" fill="#FF5F56"/>
  <circle cx="106" cy="67" r="5" fill="#FFBD2E"/>
  <circle cx="124" cy="67" r="5" fill="#27C93F"/>

  <!-- URL bar -->
  <rect x="180" y="58" width="240" height="18" rx="9" fill="#070a18" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="300" y="71" fill="#8892b0" font-family="sans-serif" font-size="9" text-anchor="middle" letter-spacing="0.5">jairajsapkal.netlify.app</text>

  <!-- Website Content Preview inside window -->
  <text x="90" y="115" fill="#00E5FF" font-family="monospace" font-size="14" font-weight="bold">&lt;Jairaj/&gt;</text>
  <rect x="420" y="108" width="80" height="8" rx="4" fill="#ffffff" fill-opacity="0.15"/>

  <!-- Left text area -->
  <rect x="90" y="155" width="70" height="8" rx="4" fill="#7C3AED"/>
  <text x="90" y="190" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">Jairaj Sapkal</text>
  <text x="90" y="215" fill="#00E5FF" font-family="monospace" font-size="14">AI &amp; Web Developer</text>
  
  <rect x="90" y="235" width="220" height="6" rx="3" fill="#ffffff" fill-opacity="0.4"/>
  <rect x="90" y="248" width="180" height="6" rx="3" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="90" y="261" width="140" height="6" rx="3" fill="#ffffff" fill-opacity="0.2"/>

  <rect x="90" y="285" width="110" height="28" rx="14" fill="#7C3AED"/>
  <text x="145" y="303" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Explore My Work</text>

  <!-- Right profile card mockup -->
  <rect x="350" y="150" width="160" height="175" rx="16" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="430" cy="195" r="30" fill="#1e295d" stroke="#00E5FF" stroke-width="2"/>
  <circle cx="430" cy="188" r="12" fill="#00E5FF" fill-opacity="0.7"/>
  <path d="M 405 215 C 405 200, 455 200, 455 215" fill="#00E5FF" fill-opacity="0.7"/>

  <rect x="385" y="240" width="90" height="8" rx="4" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="400" y="256" width="60" height="6" rx="3" fill="#00E5FF" fill-opacity="0.6"/>
  
  <rect x="370" y="280" width="50" height="16" rx="8" fill="#7C3AED" fill-opacity="0.4"/>
  <rect x="428" y="280" width="50" height="16" rx="8" fill="#00E5FF" fill-opacity="0.25"/>
</svg>
